<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amora Fut — Gerador de produto</title><style>body{font-family:Arial;margin:0;background:#f6f6f7;color:#111}.wrap{max-width:900px;margin:40px auto;padding:20px}.box{background:#fff;border:1px solid #ddd;border-radius:15px;padding:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:12px 16px;border:0;border-radius:8px;background:#f20b68;color:#fff;font-weight:800;cursor:pointer}.out{background:#111;color:#fff;padding:15px;border-radius:10px;white-space:pre-wrap;font-size:12px;margin-top:20px}</style></head><body><div class="wrap"><div class="box"><h1>Amora Fut — cadastro rápido</h1><p>Esta página gera um objeto de produto para você copiar para <code>js/products.js</code>. É uma ferramenta local, não um painel administrativo seguro para produção.</p><div class="row"><div class="field"><label>ID</label><input id="id" placeholder="flamengo-2026-jogador"></div><div class="field"><label>Nome</label><input id="name" placeholder="Camisa Flamengo 2026"></div><div class="field"><label>Categoria</label><input id="category" value="Brasileiros"></div><div class="field"><label>Versão</label><input id="version" value="Torcedor"></div><div class="field"><label>Preço</label><input id="price" type="number" value="160"></div><div class="field"><label>Badge</label><input id="badge" value="LANÇAMENTO"></div></div><div class="field"><label>Descrição</label><textarea id="desc" rows="4"></textarea></div><div class="field"><label>Imagens, uma por linha</label><textarea id="images" rows="5" placeholder="assets/images/flamengo-01.jpg"></textarea></div><button onclick="gen()">GERAR CÓDIGO</button><div id="out" class="out"></div></div></div><script>function v(id){return document.getElementById(id).value.trim()}function gen(){const o={id:v('id'),name:v('name'),category:v('category'),version:v('version'),price:Number(v('price')),sizes:['P','M','G','GG'],stock:{P:0,M:0,G:0,GG:0},badge:v('badge'),description:v('desc'),images:v('images').split('\n').map(x=>x.trim()).filter(Boolean),specs:[['Produto',v('name')],['Versão',v('version')],['Tamanhos','P • M • G • GG'],['Envio','Todo o Brasil']]};document.getElementById('out').textContent=JSON.stringify(o,null,2)}</script></body></html>
