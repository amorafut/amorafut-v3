<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amora Fut Streetwear | Camisas de Futebol</title>
<meta name="description" content="Amora Fut Streetwear — camisas de futebol e streetwear. Enviamos para todo o Brasil.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/premium-product.css">
</head>

<body>
<header class="siteHeader">
  <div class="headerInner">
    <a class="brand" href="#inicio" aria-label="Amora Fut Streetwear">
      <span class="brandMark">AMORA</span>
      <span class="brandSub">FUT STREETWEAR</span>
    </a>

    <nav class="mainNav" aria-label="Navegação principal">
      <a href="#inicio">Início</a>
      <a href="#catalogo">Catálogo</a>
      <a href="#sobre">Sobre</a>
      <a href="#politicas">Políticas</a>
    </nav>

    <div class="headerActions">
      <button class="iconBtn" id="searchToggle" type="button" aria-label="Pesquisar">⌕</button>
      <button class="iconBtn" id="cartToggle" type="button" aria-label="Carrinho">🛒<span id="cartCount">0</span></button>
    </div>
  </div>

  <div class="searchBar" id="searchBar">
    <input id="searchInput" type="search" placeholder="Buscar camisa, time ou seleção..." autocomplete="off">
  </div>
</header>

<main id="app"></main>

<aside class="cartDrawer" id="cartDrawer" aria-hidden="true">
  <div class="cartDrawerHead">
    <h2>Seu carrinho</h2>
    <button id="cartClose" type="button" aria-label="Fechar">×</button>
  </div>
  <div id="cartItems"></div>
  <div class="cartFooter">
    <div class="cartTotalRow">
      <span>Total</span>
      <strong id="cartTotal">R$ 0,00</strong>
    </div>
    <button id="checkoutBtn" class="primaryBtn" type="button">Finalizar pedido</button>
  </div>
</aside>

<div class="drawerOverlay" id="drawerOverlay"></div>

<footer class="siteFooter">
  <div class="footerInner">
    <div>
      <strong>Amora Fut Streetwear</strong>
      <p>Camisas de futebol e streetwear. Enviamos para todo o Brasil.</p>
    </div>
    <div>
      <a href="https://instagram.com/amorafutcamisas" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script src="js/premium-product.js"></script>
</body>
</html>
